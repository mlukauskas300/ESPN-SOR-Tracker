name: Daily ESPN BPI Update

on:
  schedule:
    # Runs daily at 10:00 AM UTC (6:00 AM ET)
    - cron: '0 10 * * *'
  workflow_dispatch: # Allows manual run button

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Run Scraper
        run: python fetch_bpi.py

      - name: Save Updated CSV
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add bpi_rankings.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update BPI rankings" && git push)
